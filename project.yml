name: 清屏
options:
  bundleIdPrefix: com.adam
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  清屏:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adam.clearscreen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/ClearScreen.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: 清屏隧道

  清屏隧道:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adam.clearscreen.tunnel
        CODE_SIGN_ENTITLEMENTS: Extension/Tunnel.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  清屏:
    build:
      targets:
        清屏: all
    run:
      config: Debug
    archive:
      config: Release
