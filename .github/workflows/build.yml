name: build-ipa
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project (含格式降级兜底)
        run: |
          xcodegen generate
          # XcodeGen 可能写出 objectVersion 77（Xcode 26 格式），老 Xcode 读不了——降到 60 通用格式
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 60/' 清屏.xcodeproj/project.pbxproj

      # 无签名编译：产物用 Sideloadly + 自己的 Apple ID 重签再装
      - name: Build unsigned app
        run: |
          xcodebuild -project 清屏.xcodeproj \
            -scheme 清屏 -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package ipa
        run: |
          mkdir -p build/Payload
          cp -r "build/Build/Products/Release-iphoneos/清屏.app" build/Payload/
          cd build && zip -r 清屏-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: 清屏-unsigned-ipa
          path: build/清屏-unsigned.ipa
