name: build-ipa
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # 编译产出未签名 ipa：下载后用 Sideloadly + 自己的 Apple ID 重签再装
      - name: Build archive
        run: |
          xcodebuild -project 清屏.xcodeproj \
            -scheme 清屏 -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/清屏.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean archive

      - name: Export unsigned ipa
        run: |
          mkdir -p build/Payload
          cp -r "build/清屏.xcarchive/Products/Applications/清屏.app" build/Payload/
          cd build && zip -r 清屏-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: 清屏-unsigned-ipa
          path: build/清屏-unsigned.ipa
